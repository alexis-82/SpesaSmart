# Pubblica un aggiornamento OTA (solo JavaScript e asset) sul canale "production"
# a ogni push su main. Lo ricevono gli APK con la stessa versione (runtimeVersion = appVersion).
name: Aggiornamento OTA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Una modifica nativa con la stessa versione arriverebbe agli APK esistenti e li manderebbe
      # in crash. In quel caso serve alzare la versione in app.json e compilare un nuovo APK.
      # Se la modifica è sicuramente solo JavaScript, si può pubblicare lanciando il workflow a mano.
      - name: Controlla modifiche native senza cambio di versione
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "Commit precedente non disponibile: controllo saltato."
            exit 0
          fi
          NATIVE=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -E '^(package\.json|app\.json|eas\.json)$' || true)
          if [ -z "$NATIVE" ]; then
            exit 0
          fi
          OLD=$(git show "$BEFORE:app.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).expo.version||'')}catch{console.log('')}})")
          NEW=$(node -p "require('./app.json').expo.version")
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::Modificati $(echo $NATIVE) senza cambiare la versione ($NEW). Se la modifica è nativa alza la versione e compila un nuovo APK; se è solo JavaScript lancia questo workflow a mano."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installa le dipendenze
        run: npm ci

      - name: Controlli
        run: |
          npx tsc --noEmit
          npm test

      - name: Pubblica l'aggiornamento
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE=$(printf '%s' "${COMMIT_MESSAGE:-Aggiornamento manuale}" | head -n 1)
          eas update --channel production --platform android --environment production \
            --message "$MESSAGE" --non-interactive
